<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <!-- TEMPLATE 10: STORY/REEL CINEMATOGRÁFICO | Portrait 1080×1920 -->
  <!-- Ideal para: Reels, Stories, conteúdo em movimento -->

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=League+Gothic&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

      .headline-cinematic {
        font-family: 'League Gothic', sans-serif;
        font-size: 120px;
        font-weight: 700;
        fill: #FFFFFF;
        text-transform: uppercase;
        letter-spacing: 2px;
        line-height: 1;
      }

      .subtitle-cinematic {
        font-family: 'Montserrat', sans-serif;
        font-size: 28px;
        font-weight: 600;
        fill: #F5F4F2;
        line-height: 1.3;
        letter-spacing: 0.5px;
      }

      .accent-red-line {
        fill: #E5341E;
      }

      .signature {
        font-family: 'Montserrat', sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #AEAEAE;
        letter-spacing: 0.5px;
      }
    </style>

    <linearGradient id="overlay-cinematic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:0.2" />
      <stop offset="80%" style="stop-color:#000000;stop-opacity:0.45" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND PRETO -->
  <rect width="1080" height="1920" fill="#0E0E0E"/>

  <!-- IMAGEM PLACEHOLDER (portrait completo) -->
  <rect width="1080" height="1920" fill="#2A2A2A" opacity="0.3"/>
  <text x="540" y="960" text-anchor="middle" font-size="14" fill="#AEAEAE" opacity="0.4">
    [IMAGEM CINEMATOGRÁFICA - 1080×1920]
  </text>

  <!-- OVERLAY GRADIENT CINEMATIC -->
  <rect width="1080" height="1920" fill="url(#overlay-cinematic)"/>

  <!-- CONTEÚDO POSICIONADO NA BASE -->
  <g id="content">
    <!-- LINHA DIVISÓRIA VERMELHA -->
    <rect x="60" y="1420" width="100" height="4" class="accent-red-line"/>

    <!-- HEADLINE -->
    <text x="60" y="1530" class="headline-cinematic" id="headline">
      <tspan x="60" dy="0">REEL</tspan>
      <tspan x="60" dy="130">TITLE</tspan>
    </text>

    <!-- SUBTITLE -->
    <text x="60" y="1820" class="subtitle-cinematic" id="subtitle">
      Something inspiring for your moment
    </text>

    <!-- ASSINATURA -->
    <text x="1020" y="1890" class="signature" text-anchor="end">@bomfim1710</text>
  </g>

  <!-- MARGEM DE SEGURANÇA PARA NOTCHES -->
  <rect x="60" y="100" width="960" height="1720" fill="none" stroke="#E5341E" stroke-width="1" stroke-dasharray="5,5" opacity="0.2"/>
</svg>
