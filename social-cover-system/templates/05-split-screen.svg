<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <!-- TEMPLATE 05: SPLIT SCREEN | 50% foto + 50% tipografia -->
  <!-- Ideal para: Antes/Depois, comparação, contraste -->

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=League+Gothic&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

      .headline-split {
        font-family: 'League Gothic', sans-serif;
        font-size: 100px;
        font-weight: 700;
        fill: #FFFFFF;
        text-transform: uppercase;
        letter-spacing: 1px;
        line-height: 1.1;
      }

      .label-split {
        font-family: 'Montserrat', sans-serif;
        font-size: 20px;
        font-weight: 600;
        fill: #E5341E;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .subtitle-split {
        font-family: 'Montserrat', sans-serif;
        font-size: 18px;
        font-weight: 400;
        fill: #F5F4F2;
        line-height: 1.4;
      }

      .signature {
        font-family: 'Montserrat', sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: #4A4A4A;
      }
    </style>
  </defs>

  <!-- LADO ESQUERDO: FOTO -->
  <rect x="0" y="0" width="540" height="1350" fill="#2A2A2A" opacity="0.5"/>
  <text x="270" y="675" text-anchor="middle" font-size="14" fill="#AEAEAE" opacity="0.4">
    [FOTO ESQUERDA - 540×1350]
  </text>

  <!-- LADO DIREITO: TIPOGRAFIA -->
  <rect x="540" y="0" width="540" height="1350" fill="#0E0E0E"/>

  <!-- DIVISOR -->
  <line x1="540" y1="60" x2="540" y2="1290" stroke="#E5341E" stroke-width="3"/>

  <!-- CONTEÚDO DIREITO -->
  <g id="content-right">
    <!-- LABEL -->
    <text x="610" y="300" class="label-split" id="label">
      Depois
    </text>

    <!-- HEADLINE -->
    <text x="610" y="470" class="headline-split" id="headline">
      <tspan x="610" dy="0">YOUR</tspan>
      <tspan x="610" dy="100">JOURNEY</tspan>
    </text>

    <!-- SUBTITLE -->
    <text x="610" y="750" class="subtitle-split" id="subtitle">
      <tspan x="610" dy="0">Transformation starts</tspan>
      <tspan x="610" dy="24">when you decide</tspan>
      <tspan x="610" dy="24">to be consistent</tspan>
    </text>

    <!-- ASSINATURA -->
    <text x="1000" y="1310" class="signature" text-anchor="end">@bomfim1710</text>
  </g>
</svg>
