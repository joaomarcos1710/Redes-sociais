<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <!-- TEMPLATE 04: TEXTO SOBRE FOTOGRAFIA | Foto full + texto centralizado -->
  <!-- Ideal para: Citações, afirmações, conceitos -->

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

      .quote-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 48px;
        font-weight: 600;
        fill: #FFFFFF;
        text-anchor: middle;
        line-height: 1.3;
        letter-spacing: -0.5px;
      }

      .quote-mark {
        font-size: 120px;
        fill: #E5341E;
        opacity: 0.8;
      }

      .attribution {
        font-family: 'Montserrat', sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #F5F4F2;
        text-anchor: middle;
        letter-spacing: 1px;
      }

      .signature {
        font-family: 'Montserrat', sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: #AEAEAE;
      }
    </style>

    <radialGradient id="center-overlay" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.4" />
    </radialGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1080" height="1350" fill="#0E0E0E"/>

  <!-- IMAGEM PLACEHOLDER -->
  <rect width="1080" height="1350" fill="#2A2A2A" opacity="0.3"/>
  <text x="540" y="675" text-anchor="middle" font-size="14" fill="#AEAEAE" opacity="0.4">
    [IMAGEM DE FUNDO - 1080×1350]
  </text>

  <!-- OVERLAY RADIAL -->
  <rect width="1080" height="1350" fill="url(#center-overlay)"/>

  <!-- OVERLAY ADICIONAL PARA LEGIBILIDADE -->
  <rect width="1080" height="500" y="425" fill="url(#overlay-dark)"/>

  <defs>
    <linearGradient id="overlay-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:0.45" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- CONTEÚDO -->
  <g id="content">
    <!-- ASPAS -->
    <text x="540" y="500" class="quote-mark">"</text>

    <!-- CITAÇÃO -->
    <text x="540" y="680" class="quote-text" id="quote">
      <tspan x="540" dy="0">Your path is unique</tspan>
      <tspan x="540" dy="60">and that's your power</tspan>
    </text>

    <!-- ATRIBUIÇÃO -->
    <text x="540" y="900" class="attribution" id="attribution">João Marcos</text>

    <!-- ASSINATURA -->
    <text x="1020" y="1330" class="signature" text-anchor="end">@bomfim1710</text>
  </g>
</svg>
