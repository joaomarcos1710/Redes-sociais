<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <!-- TEMPLATE 03: TIPOGRÁFICO | 70% tipografia + 30% espaço negativo -->
  <!-- Ideal para: Quando foto não é essencial -->

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=League+Gothic&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

      .headline-large {
        font-family: 'League Gothic', sans-serif;
        font-size: 160px;
        font-weight: 700;
        fill: #FFFFFF;
        text-transform: uppercase;
        letter-spacing: 2px;
        line-height: 1;
      }

      .headline-secondary {
        font-family: 'Montserrat', sans-serif;
        font-size: 32px;
        font-weight: 600;
        fill: #F5F4F2;
        line-height: 1.3;
        letter-spacing: 0.5px;
      }

      .accent-red {
        fill: #E5341E;
      }

      .signature {
        font-family: 'Montserrat', sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #4A4A4A;
      }
    </style>
  </defs>

  <!-- FUNDO PRETO -->
  <rect width="1080" height="1350" fill="#0E0E0E"/>

  <!-- ELEMENTO DECORATIVO (opcional) -->
  <circle cx="1080" cy="0" r="200" fill="#2A2A2A" opacity="0.4"/>

  <!-- CONTEÚDO -->
  <g id="content">
    <!-- LINHA DIVISÓRIA -->
    <rect x="60" y="400" width="120" height="5" fill="#E5341E"/>

    <!-- HEADLINE PRINCIPAL -->
    <text x="60" y="550" class="headline-large" id="main-headline">
      <tspan x="60" dy="0">TYPE</tspan>
      <tspan x="60" dy="160">FACE</tspan>
    </text>

    <!-- WORD HIGHLIGHT EM VERMELHO -->
    <text x="60" y="550" class="headline-large accent-red" id="highlight">
      <tspan x="60" dy="160">FACE</tspan>
    </text>

    <!-- SUBTÍTULO -->
    <text x="60" y="950" class="headline-secondary" id="subtitle">
      <tspan x="60" dy="0">A complete typographic</tspan>
      <tspan x="60" dy="40">exploration about your</tspan>
      <tspan x="60" dy="40">personal development</tspan>
    </text>

    <!-- ASSINATURA -->
    <text x="60" y="1310" class="signature">@bomfim1710</text>
  </g>

  <!-- AREA SEGURA -->
  <rect x="60" y="60" width="960" height="1230" fill="none" stroke="#E5341E" stroke-width="1" stroke-dasharray="5,5" opacity="0.2"/>
</svg>
