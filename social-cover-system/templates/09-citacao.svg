<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <!-- TEMPLATE 09: CITAÇÃO | 50% tipografia + 50% foto/vazio -->
  <!-- Ideal para: Reflexões, frases de impacto, destaques -->

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=League+Gothic&display=swap');

      .quote-primary {
        font-family: 'Montserrat', sans-serif;
        font-size: 56px;
        font-weight: 600;
        fill: #FFFFFF;
        line-height: 1.3;
        letter-spacing: -0.5px;
      }

      .quote-mark-open {
        font-size: 100px;
        font-family: 'League Gothic', sans-serif;
        fill: #E5341E;
        opacity: 0.6;
      }

      .attribution {
        font-family: 'Montserrat', sans-serif;
        font-size: 18px;
        font-weight: 600;
        fill: #AEAEAE;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .signature {
        font-family: 'Montserrat', sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: #4A4A4A;
      }
    </style>
  </defs>

  <!-- LADO ESQUERDO: TIPOGRAFIA -->
  <rect x="0" y="0" width="540" height="1350" fill="#0E0E0E"/>

  <!-- LADO DIREITO: FOTO/VAZIO -->
  <rect x="540" y="0" width="540" height="1350" fill="#2A2A2A" opacity="0.4"/>
  <text x="810" y="675" text-anchor="middle" font-size="14" fill="#AEAEAE" opacity="0.3">
    [IMAGEM 540×1350]
  </text>

  <!-- DIVISOR VERMELHO -->
  <rect x="540" y="200" width="3" height="950" fill="#E5341E"/>

  <!-- CONTEÚDO -->
  <g id="content">
    <!-- ASPAS ABERTAS -->
    <text x="100" y="380" class="quote-mark-open">"</text>

    <!-- CITAÇÃO -->
    <text x="100" y="520" class="quote-primary" id="quote">
      <tspan x="100" dy="0">The obstacles</tspan>
      <tspan x="100" dy="70">are the path</tspan>
    </text>

    <!-- ATRIBUIÇÃO -->
    <text x="100" y="950" class="attribution" id="attribution">— Marcus Aurelius</text>

    <!-- ASSINATURA -->
    <text x="100" y="1310" class="signature">@bomfim1710</text>
  </g>
</svg>
