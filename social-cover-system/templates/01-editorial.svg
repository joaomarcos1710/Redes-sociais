<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- TEMPLATE 01: EDITORIAL | 60% foto + 40% tipografia sobre overlay -->
  <!-- Ideal para: Conteúdo com foto impactante e headline direto -->

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=League+Gothic&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

      .headline-primary {
        font-family: 'League Gothic', sans-serif;
        font-size: 140px;
        font-weight: 700;
        fill: #FFFFFF;
        text-transform: uppercase;
        letter-spacing: 2px;
        line-height: 1.1;
      }

      .headline-secondary {
        font-family: 'Montserrat', sans-serif;
        font-size: 28px;
        font-weight: 600;
        fill: #F5F4F2;
        line-height: 1.4;
        letter-spacing: 0.5px;
      }

      .signature {
        font-family: 'Montserrat', sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #AEAEAE;
        letter-spacing: 0.5px;
      }
    </style>

    <!-- Overlay semi-transparente para legibilidade -->
    <linearGradient id="overlay-editorial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.1" />
      <stop offset="60%" style="stop-color:#000000;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.5" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND: Espaço para imagem de fundo -->
  <rect width="1080" height="1350" fill="#0E0E0E"/>

  <!-- IMAGEM PLACEHOLDER (Será substituída por imagem real) -->
  <rect width="1080" height="1350" fill="#2A2A2A" opacity="0.3"/>
  <text x="540" y="675" text-anchor="middle" class="signature" opacity="0.5">
    [IMAGEM 1080×1350]
  </text>

  <!-- OVERLAY GRADIENT para garantir legibilidade -->
  <rect width="1080" height="1350" fill="url(#overlay-editorial)"/>

  <!-- CONTEÚDO TIPOGRÁFICO -->
  <g id="content">
    <!-- Linha divisória vermelho (opcional) -->
    <rect x="60" y="880" width="100" height="4" fill="#E5341E"/>

    <!-- HEADLINE PRINCIPAL -->
    <text x="60" y="920" class="headline-primary" id="headline">
      <tspan x="60" dy="0">EDITORIAL</tspan>
      <tspan x="60" dy="140">TITLE</tspan>
    </text>

    <!-- HEADLINE SECUNDÁRIA -->
    <text x="60" y="1180" class="headline-secondary" id="subheadline">
      <tspan x="60" dy="0">Subtitle explaining the context</tspan>
      <tspan x="60" dy="30">or additional information</tspan>
    </text>

    <!-- ASSINATURA -->
    <text x="60" y="1310" class="signature">@bomfim1710</text>
  </g>

  <!-- AREA SEGURA (Não mostrar em preview, apenas guia) -->
  <rect x="60" y="60" width="960" height="1230" fill="none" stroke="#E5341E" stroke-width="1" stroke-dasharray="5,5" opacity="0.3"/>

  <!-- GRID DE REFERÊNCIA (Desabilitar em produção) -->
  <g id="grid-reference" opacity="0" style="pointer-events: none;">
    <line x1="0" y1="675" x2="1080" y2="675" stroke="#E5341E" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="1350" stroke="#E5341E" stroke-width="1"/>
  </g>
</svg>
